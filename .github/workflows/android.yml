name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # so a merge commit's PR branch (HEAD^2) is available for release notes

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        working-directory: android
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.jks
          SIGNING_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk SpeakEasy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpeakEasy-apk
          path: SpeakEasy.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.KEYSTORE_B64 != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::No signing key secret - built with debug key, not publishing a release."
            exit 0
          fi
          # The commit message becomes the "what's new" text in the app's update dialog.
          # For a merged PR, use the PR's own commit, not "Merge pull request #N from ...".
          REF=HEAD; git rev-parse -q --verify HEAD^2 >/dev/null && REF=HEAD^2
          git log -1 --pretty=%B "$REF" | grep -v -e '^Co-Authored-By' -e '^Claude-Session' > notes.txt
          gh release create "v1.0.${{ github.run_number }}" SpeakEasy.apk \
            --title "SpeakEasy 1.0.${{ github.run_number }}" \
            --notes-file notes.txt \
            --latest
