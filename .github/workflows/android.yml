name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  # PRs build and run the tests too, so problems show up before merging. Only main publishes.
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: release notes look through a merged PR's commits

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Unit tests
        working-directory: android
        run: gradle testReleaseUnitTest --no-daemon --stacktrace

      - name: Build release APK
        working-directory: android
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.jks
          SIGNING_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk SpeakEasy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpeakEasy-apk
          path: SpeakEasy.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.KEYSTORE_B64 != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::No signing key secret - built with debug key, not publishing a release."
            exit 0
          fi
          # The commit message becomes the "what's new" text in the app's update dialog.
          # For a merged PR, use the PR's newest user-facing commit: not "Merge pull request #N
          # from ...", and not housekeeping commits (CI:, Docs:, Test:) added during review.
          REF=HEAD
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            REF=$(git log --format='%H %s' HEAD^1..HEAD^2 \
              | grep -v -E '^[0-9a-f]+ (CI|Docs?|Tests?):' | head -1 | cut -d' ' -f1)
            REF=${REF:-HEAD^2}
          fi
          git log -1 --pretty=%B "$REF" | grep -v -e '^Co-Authored-By' -e '^Claude-Session' > notes.txt
          gh release create "v1.0.${{ github.run_number }}" SpeakEasy.apk \
            --title "SpeakEasy 1.0.${{ github.run_number }}" \
            --notes-file notes.txt \
            --latest
