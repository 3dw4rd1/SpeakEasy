# Lives in Nginx Proxy Manager's custom include: /opt/nginx-proxy-manager/data/nginx/custom/http.conf
# Cloudflare terminates TLS and reaches the origin on :80.
server {
  listen 80;
  listen [::]:80;
  server_name speakeasy.kauri-systems.com;

  client_max_body_size 25m;

  # Resolve at request time via Docker DNS, so nginx still starts if the container is down.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $speakeasy_upstream http://speakeasy:8000;

  location / {
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }
    proxy_pass $speakeasy_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Long brain dumps (Whisper + Sonnet) can take minutes; the app waits 200 s. Note Cloudflare's
    # proxy still cuts requests at 100 s on non-Enterprise plans, so that's the real cap for now.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }
}
